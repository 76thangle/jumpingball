<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Orange Ball Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  background:linear-gradient(#6ec6ff,#e0f7fa);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* ===== SCALE ===== */
#scale{transform-origin:top center}

/* ===== GAME ===== */
#game{
  width:360px;
  height:640px;
  position:relative;
  overflow:hidden;
  border-radius:24px;
  background:linear-gradient(#87ceeb,#e3f8ff);
  box-shadow:0 20px 40px rgba(0,0,0,.3);
}

/* ===== CLOUD ===== */
.cloud{
  position:absolute;
  width:120px;height:50px;
  background:white;border-radius:50px;
  opacity:.8;animation:cloudMove 30s linear infinite;
}
.cloud::before,.cloud::after{
  content:"";position:absolute;
  width:60px;height:60px;
  background:white;border-radius:50%;top:-25px;
}
.cloud::before{left:15px}
.cloud::after{right:15px}
@keyframes cloudMove{from{left:-150px}to{left:400px}}

/* ===== GROUND ===== */
#ground{
  position:absolute;bottom:0;width:100%;height:60px;
  background:linear-gradient(#4e342e,#3e2723);
}

/* ===== BALL ===== */
#ball{
  position:absolute;
  left:160px;bottom:60px;
  width:42px;height:42px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff3e0,orange 60%,#f57c00);
  display:flex;justify-content:center;align-items:center;
}
#ball::after{
  content:"";position:absolute;
  top:6px;left:8px;width:14px;height:10px;
  background:rgba(255,255,255,.5);border-radius:50%;
}
.face{position:absolute;width:100%;height:100%}
.eye{
  position:absolute;top:14px;width:6px;height:6px;
  background:#333;border-radius:50%;
}
.eye.left{left:12px}
.eye.right{right:12px}
.mouth{
  position:absolute;bottom:12px;left:50%;
  width:14px;height:8px;
  border-bottom:3px solid #333;
  border-radius:0 0 20px 20px;
  transform:translateX(-50%);
}
.idle{animation:idleBounce 2s ease-in-out infinite}
@keyframes idleBounce{
  0%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-6px) rotate(8deg)}
  100%{transform:translateY(0) rotate(0)}
}

/* ===== CACTUS ===== */
.cactus{
  position:absolute;
  bottom:60px;
  width:26px;
  height:60px;
  background:linear-gradient(#4caf50,#2e7d32);
  border-radius:14px;
  animation:cactusShake .8s infinite;
}
.cactus::before,
.cactus::after{
  content:"";
  position:absolute;
  width:16px;height:28px;
  background:linear-gradient(#4caf50,#2e7d32);
  border-radius:12px;
}
.cactus::before{
  left:-10px;top:18px;
  transform:rotate(-20deg);
}
.cactus::after{
  right:-10px;top:24px;
  transform:rotate(20deg);
}
@keyframes cactusShake{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-2px)}
}

/* ===== FRUIT ===== */
.fruit{
  position:absolute;
  bottom:200px;
  width:36px;height:36px;
  background-size:cover;
  animation:floatFruit 2s ease-in-out infinite;
}
@keyframes floatFruit{
  0%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
  100%{transform:translateY(0)}
}

/* ===== PARTICLE ===== */
.particle{
  position:absolute;
  width:8px;height:8px;
  background:orange;
  border-radius:50%;
  pointer-events:none;
}

/* ===== UI ===== */
#ui{position:absolute;top:12px;left:12px;display:flex;gap:8px}
button{padding:6px 14px;border:none;border-radius:10px}
#timer{position:absolute;top:14px;right:14px;font-weight:bold}

/* ===== OVERLAY ===== */
#overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.6);
  display:none;justify-content:center;align-items:center;
}
#gameover{
  background:white;padding:28px 36px;
  border-radius:20px;text-align:center;
}
</style>
</head>

<body>

<div id="scale">
<div id="game">

<div class="cloud" style="top:40px"></div>
<div class="cloud" style="top:90px;animation-delay:8s"></div>

<div id="ui">
<button onclick="startGame()">▶ Start</button>
<button onclick="pauseGame()">⏸</button>
</div>

<div id="timer">0.0s</div>

<div id="ball" class="idle">
  <div class="face">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>
</div>

<div id="ground"></div>

<div id="overlay">
  <div id="gameover">
    <h2>🎉 Chúc mừng!</h2>
    <p>Thời gian sống</p>
    <h1 id="finalTime">0.0s</h1>
    <button onclick="newGame()">🔁 New Game</button>
    <button onclick="location.reload()">❌ Exit</button>
  </div>
</div>

</div>
</div>

<script>
const game=document.getElementById("game");
const ball=document.getElementById("ball");
const timerEl=document.getElementById("timer");
const overlay=document.getElementById("overlay");
const finalTime=document.getElementById("finalTime");

let y=60,v=0,gravity=.9;
let jumping=false,running=false,paused=false,gameOver=false;
let time=0,size=42;
let updateLoop,spikeLoop,fruitLoop,timerLoop;

const fruits=[
"https://cdn-icons-png.flaticon.com/512/415/415733.png",
"https://cdn-icons-png.flaticon.com/512/590/590685.png"
];

game.addEventListener("click",jump);
document.addEventListener("keydown",e=>e.code==="Space"&&jump);

function jump(){
 if(!jumping&&running&&!paused&&!gameOver){
  v=16;jumping=true;
 }
}

function startGame(){
 if(running)return;
 resetGame();ball.classList.remove("idle");
 running=true;
 updateLoop=setInterval(update,20);
 spikeLoop=setInterval(createCactus,900);
 fruitLoop=setInterval(createFruit,2600);
 timerLoop=setInterval(()=>{
  if(!paused&&!gameOver){
   time+=.1;
   timerEl.textContent=time.toFixed(1)+"s";
  }
 },100);
}

function pauseGame(){if(!gameOver)paused=!paused}

function update(){
 if(paused||gameOver)return;
 if(jumping){
  v-=gravity;y+=v;
  if(y<=60){y=60;jumping=false}
  ball.style.bottom=y+"px";
 }
 checkCollision();
}

function createCactus(){
 if(gameOver||paused)return;
 const c=document.createElement("div");
 c.className="cactus";
 c.style.right="-40px";
 game.appendChild(c);
 const move=setInterval(()=>{
  if(gameOver||paused)return;
  c.style.right=(parseFloat(c.style.right)+6)+"px";
  if(parseFloat(c.style.right)>400){c.remove();clearInterval(move)}
 },20);
}

function createFruit(){
 if(gameOver||paused)return;
 const f=document.createElement("div");
 f.className="fruit";
 f.style.backgroundImage=`url(${fruits[Math.random()*fruits.length|0]})`;
 f.style.right="-40px";
 game.appendChild(f);
 const move=setInterval(()=>{
  if(gameOver||paused)return;
  f.style.right=(parseFloat(f.style.right)+4)+"px";
  if(parseFloat(f.style.right)>400){f.remove();clearInterval(move)}
 },20);
}

function checkCollision(){
 const b=ball.getBoundingClientRect();
 document.querySelectorAll(".cactus").forEach(c=>{
  if(collide(b,c.getBoundingClientRect()))explode();
 });
 document.querySelectorAll(".fruit").forEach(f=>{
  if(collide(b,f.getBoundingClientRect())){
   f.remove();size+=5;
   ball.style.width=ball.style.height=size+"px";
  }
 });
}

function collide(a,b){
 return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

function explode(){
 if(gameOver)return;
 gameOver=true;stopAll();
 spawnParticles();
 ball.style.display="none";
 document.querySelectorAll(".cactus,.fruit").forEach(e=>e.remove());
 finalTime.textContent=time.toFixed(1)+"s";
 overlay.style.display="flex";
}

function spawnParticles(){
 for(let i=0;i<12;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=ball.offsetLeft+20+"px";
  p.style.bottom=y+20+"px";
  game.appendChild(p);
  let vx=(Math.random()-0.5)*8;
  let vy=Math.random()*8;
  const anim=setInterval(()=>{
   vy-=0.5;
   p.style.left=p.offsetLeft+vx+"px";
   p.style.bottom=p.offsetTop+vy+"px";
   if(p.offsetTop>700){p.remove();clearInterval(anim)}
  },20);
 }
}

function stopAll(){
 clearInterval(updateLoop);
 clearInterval(spikeLoop);
 clearInterval(fruitLoop);
 clearInterval(timerLoop);
}

function resetGame(){
 document.querySelectorAll(".cactus,.fruit,.particle").forEach(e=>e.remove());
 size=42;ball.style.width=ball.style.height=size+"px";
 y=60;ball.style.bottom=y+"px";
 time=0;paused=false;gameOver=false;
 ball.style.display="flex";
 overlay.style.display="none";
}

function newGame(){stopAll();running=false;startGame()}

function resizeGame(){
 const s=Math.min(innerWidth/360,innerHeight/640);
 document.getElementById("scale").style.transform=`scale(${s})`;
}
window.addEventListener("resize",resizeGame);
resizeGame();
</script>

</body>
</html>
