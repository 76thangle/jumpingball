<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Orange Ball Runner</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(#6ec6ff, #e0f7fa);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== GAME CONTAINER ===== */
#game {
  width: 900px;
  height: 320px;
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  background: linear-gradient(#87ceeb, #cfefff);
  box-shadow: 0 20px 40px rgba(0,0,0,.25);
}

/* ===== BACKGROUND ===== */
.cloud {
  position: absolute;
  top: 30px;
  width: 120px;
  height: 50px;
  background: white;
  border-radius: 50px;
  opacity: .8;
  animation: cloudMove 40s linear infinite;
}

.cloud::after,
.cloud::before {
  content: "";
  position: absolute;
  background: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  top: -25px;
}

.cloud::before { left: 15px; }
.cloud::after { right: 15px; }

@keyframes cloudMove {
  from { left: -150px; }
  to { left: 1000px; }
}

/* ===== GROUND ===== */
#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45px;
  background: linear-gradient(#4e342e, #3e2723);
}

/* ===== BALL ===== */
#ball {
  position: absolute;
  left: 120px;
  bottom: 45px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ffe0b2, orange);
}

/* idle animation */
.idle {
  animation: idleBounce 2s ease-in-out infinite;
}

@keyframes idleBounce {
  0%   { transform: translateX(-10px) translateY(0) rotate(0deg); }
  25%  { transform: translateX(10px) translateY(-6px) rotate(20deg); }
  50%  { transform: translateX(0) translateY(0) rotate(0deg); }
  75%  { transform: translateX(-10px) translateY(-6px) rotate(-20deg); }
  100% { transform: translateX(-10px) translateY(0) rotate(0deg); }
}

/* ===== SPIKE ===== */
.spike {
  position: absolute;
  bottom: 45px;
  width: 0;
  height: 0;
  border-left: 22px solid transparent;
  border-right: 22px solid transparent;
  border-bottom: 44px solid red;
}

/* ===== FRUIT ===== */
.fruit {
  position: absolute;
  top: 90px;
  width: 36px;
  height: 36px;
  background-size: cover;
}

/* ===== UI ===== */
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  display: flex;
  gap: 8px;
}

button {
  padding: 6px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

#timer {
  position: absolute;
  top: 12px;
  right: 14px;
  font-weight: bold;
}

/* ===== OVERLAY ===== */
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  justify-content: center;
  align-items: center;
}

#gameover {
  background: white;
  padding: 30px 40px;
  border-radius: 18px;
  text-align: center;
}
</style>
</head>

<body>

<div id="game">

  <!-- clouds -->
  <div class="cloud" style="top:30px; animation-delay:0s"></div>
  <div class="cloud" style="top:70px; animation-delay:10s"></div>
  <div class="cloud" style="top:110px; animation-delay:20s"></div>

  <div id="ui">
    <button onclick="startGame()">▶ Start</button>
    <button onclick="pauseGame()">⏸ Pause</button>
  </div>

  <div id="timer">0.0s</div>
  <div id="ball" class="idle"></div>
  <div id="ground"></div>

  <div id="overlay">
    <div id="gameover">
      <h2>🎉 Chúc mừng!</h2>
      <p>Thời gian sống:</p>
      <h1 id="finalTime">0.0s</h1>
      <button onclick="newGame()">🔁 New Game</button>
      <button onclick="location.reload()">❌ Exit</button>
    </div>
  </div>

</div>

<script>
const game = document.getElementById("game");
const ball = document.getElementById("ball");
const timerEl = document.getElementById("timer");
const overlay = document.getElementById("overlay");
const finalTime = document.getElementById("finalTime");

let y = 45, v = 0;
let gravity = 0.9;
let jumping = false;
let running = false;
let paused = false;
let gameOver = false;
let time = 0;
let size = 40;

let updateLoop, spikeLoop, fruitLoop, timerLoop;

const fruits = [
  "https://cdn-icons-png.flaticon.com/512/415/415733.png",
  "https://cdn-icons-png.flaticon.com/512/590/590685.png",
  "https://cdn-icons-png.flaticon.com/512/590/590772.png",
  "https://cdn-icons-png.flaticon.com/512/590/590707.png"
];

document.addEventListener("keydown", e => e.code === "Space" && jump());
game.addEventListener("click", jump);

function jump(){
  if(!jumping && running && !paused && !gameOver){
    v = 15;
    jumping = true;
  }
}

function startGame(){
  if(running) return;
  ball.classList.remove("idle"); // stop idle animation
  resetGame();
  running = true;

  updateLoop = setInterval(update,20);
  spikeLoop = setInterval(createSpike, 1100);
  fruitLoop = setInterval(createFruit, 3000);
  timerLoop = setInterval(()=>{
    if(!paused && !gameOver){
      time += 0.1;
      timerEl.textContent = time.toFixed(1)+"s";
    }
  },100);
}

function pauseGame(){
  if(!gameOver) paused = !paused;
}

function update(){
  if(!running || paused || gameOver) return;
  if(jumping){
    v -= gravity;
    y += v;
    if(y <= 45){
      y = 45;
      jumping = false;
    }
    ball.style.bottom = y+"px";
  }
  checkCollision();
}

function createSpike(){
  if(gameOver || paused) return;
  const s = document.createElement("div");
  s.className = "spike";
  s.style.borderBottomColor = `hsl(${Math.random()*360},80%,50%)`;
  s.style.right = "-50px";
  game.appendChild(s);

  const move = setInterval(()=>{
    if(gameOver || paused) return;
    s.style.right = (parseFloat(s.style.right)+7)+"px";
    if(parseFloat(s.style.right)>950){
      s.remove();
      clearInterval(move);
    }
  },20);
}

function createFruit(){
  if(gameOver || paused) return;
  const f = document.createElement("div");
  f.className = "fruit";
  f.style.backgroundImage = `url(${fruits[Math.floor(Math.random()*fruits.length)]})`;
  f.style.right = "-40px";
  game.appendChild(f);

  const move = setInterval(()=>{
    if(gameOver || paused) return;
    f.style.right = (parseFloat(f.style.right)+4)+"px";
    if(parseFloat(f.style.right)>950){
      f.remove();
      clearInterval(move);
    }
  },20);
}

function checkCollision(){
  const b = ball.getBoundingClientRect();
  document.querySelectorAll(".spike").forEach(s=>{
    if(collide(b,s.getBoundingClientRect())) explode();
  });
  document.querySelectorAll(".fruit").forEach(f=>{
    if(collide(b,f.getBoundingClientRect())){
      f.remove();
      size += 6;
      ball.style.width = ball.style.height = size+"px";
    }
  });
}

function collide(a,b){
  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

function explode(){
  if(gameOver) return;
  gameOver = true;
  stopAll();
  document.querySelectorAll(".spike,.fruit").forEach(e=>e.remove());
  finalTime.textContent = time.toFixed(1)+"s";
  overlay.style.display="flex";
}

function stopAll(){
  clearInterval(updateLoop);
  clearInterval(spikeLoop);
  clearInterval(fruitLoop);
  clearInterval(timerLoop);
}

function resetGame(){
  document.querySelectorAll(".spike,.fruit").forEach(e=>e.remove());
  size = 40;
  ball.style.width = ball.style.height = size+"px";
  y = 45;
  ball.style.bottom = y+"px";
  time = 0;
  gameOver = false;
  paused = false;
  overlay.style.display = "none";
}

function newGame(){
  stopAll();
  running = false;
  startGame();
}
</script>

</body>
</html>
